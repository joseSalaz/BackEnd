<header>
    <div id="carouselExampleIndicators" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3"
                aria-label="Slide 4"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://firebasestorage.googleapis.com/v0/b/ecomercesa-3c1ff.appspot.com/o/Baners%2FGemini_Generated_Image_x0seucx0seucx0se.png?alt=media&token=c9820e22-bbbb-444e-9ed4-3a6ac9966089"
                    class="d-block w-100" alt="Slide 1" style="height: 500px;">
            </div>
            <div class="carousel-item">
                <img src="https://pbs.twimg.com/media/Ezqk2fiXEAIPtkN?format=jpg&name=4096x4096" class="d-block w-100"
                    alt="Slide 2" style="height: 500px;">
            </div>
            <div class="carousel-item">
                <img src="https://www.apj.org.pe/photos/shares/Nosotros%20Fondo%20Editorial/Fondo_Concursable.jpg"
                    class="d-block w-100" alt="Slide 3" style="height: 500px;">
            </div>
            <div class="carousel-item">
                <img src="https://firebasestorage.googleapis.com/v0/b/ecomercesa-3c1ff.appspot.com/o/Baners%2FGemini_Generated_Image_9guki69guki69guk.png?alt=media&token=bbbf75c6-4f8e-4385-8fc4-285eb5529f83"
                    class="d-block w-100" alt="Slide 4" style="height: 500px;">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">

            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>


</header>
