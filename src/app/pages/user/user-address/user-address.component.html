<h4 class="section-title mb-4">
  <i class="fas fa-map-marked-alt me-2"></i> Mis Direcciones
</h4>

<div class="d-flex flex-wrap gap-3 justify-content-start">
  <div *ngFor="let direccion of direcciones" class="card p-4 shadow-sm border border-gray-300 rounded-lg text-start flex-grow-1" style="min-width: 280px; max-width: 31%;" >
    <h5 class="font-semibold text-truncate">{{ direccion.direccion1 }}</h5>
    <p class="text-sm text-gray-600 mb-1 text-truncate">{{ direccion.referencia }}</p>
    <p class="text-sm text-gray-600 mb-1">{{ direccion.distrito }}, {{ direccion.provincia }}, {{ direccion.departamento }}</p>
    <p class="text-sm text-gray-600"><strong>Código Postal:</strong> {{ direccion.codigoPostal }}</p>

    <div class="mt-3 d-flex justify-content-between align-items-center gap-2">
      <button *ngIf="!direccion.esPredeterminada" (click)="establecerPredeterminada(direccion.idDireccion!)" class="btn btn-outline-primary btn-sm">
        Predeterminada
      </button>
      <span *ngIf="direccion.esPredeterminada" class="text-success fw-bold text-sm">
        ✅ Predeterminada
      </span>
      <button (click)="eliminarDireccion(direccion.idDireccion!)" class="btn btn-danger btn-sm">
        Eliminar
      </button>
    </div>
  </div>
</div>

<div class="d-flex justify-content-center">
  <button class="btn btn-primary mb-3 mt-4" (click)="abrirModal()">Agregar Dirección</button>
</div>

<div *ngIf="mostrarModal" class="modal-overlay" (click)="cerrarModalAlFondo($event)">
  <div class="modal-box">
    <div class="modal-box-header">
      <h5><i class="fas fa-map-marker-alt me-2"></i> Nueva Dirección</h5>
      <button class="btn-cerrar" (click)="cerrarModal()" aria-label="Cerrar">&times;</button>
    </div>

    <div class="modal-box-body text-start">
      <form #direccionForm="ngForm">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Dirección completa</label>
            <input type="text" id="direccion1" class="form-control" [(ngModel)]="nuevaDireccion.direccion1" name="direccion1" required #direccion1="ngModel" placeholder="Av. Principal 123, Urb. Ejemplo">
            <div *ngIf="direccion1.invalid && direccion1.touched" class="text-danger text-sm mt-1">La dirección es obligatoria.</div>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Referencia (opcional)</label>
            <input type="text" id="referencia" class="form-control" [(ngModel)]="nuevaDireccion.referencia" name="referencia" placeholder="Cerca del parque, frente al colegio...">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Distrito</label>
            <input type="text" id="distrito" class="form-control" [(ngModel)]="nuevaDireccion.distrito" name="distrito" required #distrito="ngModel">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Provincia</label>
            <input type="text" id="provincia" class="form-control" [(ngModel)]="nuevaDireccion.provincia" name="provincia" required #provincia="ngModel">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Departamento</label>
            <input type="text" id="departamento" class="form-control" [(ngModel)]="nuevaDireccion.departamento" name="departamento" required #departamento="ngModel">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Código Postal</label>
            <input type="text" id="codigoPostal" class="form-control" [(ngModel)]="nuevaDireccion.codigoPostal" name="codigoPostal" placeholder="Ej: 12001">
          </div>

          <div class="col-12 mt-3">
            <label class="form-label fw-semibold">Buscar dirección o seleccionar ubicación en el mapa</label>
            <div class="input-group mb-2">
              <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
              <input class="form-control" id="map-search" type="text" placeholder="Buscar ubicación..." />
            </div>
            <div id="map" style="width: 100%; height: 250px; background-color: #eee; border-radius: 8px;"></div>
          </div>
        </div>

        <div class="d-flex gap-3 mt-4">
          <button type="button" class="btn btn-outline-secondary flex-grow-1 py-2" (click)="cerrarModal()">Cancelar</button>
          <button type="button" class="btn btn-primary flex-grow-1 py-2" (click)="validarFormulario()">
            <i class="fas fa-save me-2"></i> Guardar Dirección
          </button>
        </div>
        <p *ngIf="mensajeError" class="text-danger text-center mt-3 mb-0">{{ mensajeError }}</p>
      </form>
    </div>
  </div>
</div>
