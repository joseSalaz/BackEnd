<h4 class="section-title mb-4">
  <i class="fas fa-user-circle me-2"></i> Mi Perfil
</h4>

<div class="profile-card">
  <form #personaForm="ngForm" (ngSubmit)="editando && personaForm.valid && actualizarUsuario()">
    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Nombres</label>
        <input type="text" class="form-control" [class.form-control-plaintext]="!editando" [class.is-invalid]="nombreInput.invalid && (nombreInput.dirty || nombreInput.touched)" id="nombre" name="nombre" #nombreInput="ngModel" [(ngModel)]="persona.nombre" [readonly]="!editando" required minlength="2" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+">
        <div class="invalid-feedback" *ngIf="nombreInput.invalid && (nombreInput.dirty || nombreInput.touched)">
          <div *ngIf="nombreInput.errors?.['required']">El nombre es requerido</div>
          <div *ngIf="nombreInput.errors?.['minlength']">Mínimo 2 caracteres</div>
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Apellido Paterno</label>
        <input type="text" class="form-control" [class.form-control-plaintext]="!editando" [class.is-invalid]="apellidoPaternoInput.invalid && (apellidoPaternoInput.dirty || apellidoPaternoInput.touched)" id="apellidoPaterno" name="apellidoPaterno" #apellidoPaternoInput="ngModel" [(ngModel)]="persona.apellidoPaterno" [readonly]="!editando" required minlength="2" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+">
        <div class="invalid-feedback" *ngIf="apellidoPaternoInput.invalid && (apellidoPaternoInput.dirty || apellidoPaternoInput.touched)">
          <div *ngIf="apellidoPaternoInput.errors?.['required']">El apellido paterno es requerido</div>
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Apellido Materno</label>
        <input type="text" class="form-control" [class.form-control-plaintext]="!editando" id="apellidoMaterno" name="apellidoMaterno" [(ngModel)]="persona.apellidoMaterno" [readonly]="!editando" required minlength="2" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+">
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Correo Electrónico</label>
        <input type="email" class="form-control" [class.form-control-plaintext]="!editando" [class.is-invalid]="correoInput.invalid && (correoInput.dirty || correoInput.touched)" id="correo" name="correo" #correoInput="ngModel" [(ngModel)]="persona.correo" [readonly]="!editando" required>
        <div class="invalid-feedback" *ngIf="correoInput.invalid && (correoInput.dirty || correoInput.touched)">Ingrese un correo válido</div>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Tipo de Documento</label>
        <select class="form-select" [class.form-control-plaintext]="!editando" id="tipoDocumento" name="tipoDocumento" [(ngModel)]="persona.tipoDocumento" [disabled]="!editando" required>
          <option value="">Seleccione...</option>
          <option value="DNI">DNI</option>
          <option value="Pasaporte">Pasaporte</option>
          <option value="Carnet de Extranjería">Carnet de Extranjería</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Número de Documento</label>
        <input type="text" class="form-control" [class.form-control-plaintext]="!editando" id="numeroDocumento" name="numeroDocumento" [(ngModel)]="persona.numeroDocumento" [readonly]="!editando" required minlength="8" maxlength="12" pattern="[0-9]+">
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Teléfono</label>
        <input type="text" class="form-control" [class.form-control-plaintext]="!editando" id="telefono" name="telefono" [(ngModel)]="persona.telefono" [readonly]="!editando" required minlength="9" maxlength="9" pattern="[0-9]+">
      </div>
    </div>

    <div class="d-flex flex-wrap gap-3 mt-5">
      <button type="button" class="btn btn-outline-primary px-4 py-2" (click)="toggleEditar()">
        {{ editando ? 'Cancelar' : 'Editar Información' }}
      </button>
      <button type="submit" class="btn btn-primary px-5 py-2" *ngIf="editando" [disabled]="!personaForm.valid">
        <i class="fas fa-save me-2"></i> Guardar Cambios
      </button>
    </div>
  </form>
</div>
